<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120711">
  <title>The Ira Express</title>
  <meta name="description" content="Your ticket is ready.">
  <meta property="og:title" content="The Ira Express">
  <meta property="og:description" content="Your ticket is ready. 🎟️">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Outfit:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap&text=%F0%9F%A5%B9%F0%9F%8E%89%F0%9F%91%80%F0%9F%A4%99%F0%9F%8E%9F">
</head>
<body>
  <div id="app" class="is-opening">
    <div id="world" class="world"></div>
    <div class="window" aria-hidden="true"><span class="glare"></span></div>
    <main id="stage" class="stage" aria-live="polite"></main>
    <div id="chapter" class="chapter" aria-hidden="true"></div>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
    <div id="guide" class="guide"></div>
    <div class="bar bar-top" aria-hidden="true"><div class="bar-in"><span class="wordmark">The Ira Express</span></div></div>
    <div class="bar bar-bottom"><div class="bar-in"><nav id="map" class="map" aria-label="Journey progress"></nav></div></div>
    <button id="music" class="music" type="button" aria-pressed="false" aria-label="Turn music on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="note" d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="grain" aria-hidden="true"></div>
  </div>
  <noscript><p style="color:#fff;font-family:sans-serif;padding:2rem">The Ira Express needs JavaScript to run.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
